<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{if(localStorage.getItem('bibleExplorer.desktopView')==='1'){var sw=screen.width,sh=screen.height;if(Math.min(sw,sh)<720){var cw=(window.matchMedia&&matchMedia('(orientation: landscape)').matches)?Math.max(sw,sh):Math.min(sw,sh);var k=Math.max(0.1,Math.min(1,Math.round(cw/1280*1000)/1000));document.querySelector('meta[name=viewport]').setAttribute('content','width=1280, initial-scale='+k+', minimum-scale='+k+', maximum-scale=5');}}}catch(e){}</script>
<title>Explore Your Bible</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="Explore the 66 books of the Bible: the storyline, themes, maps, a full reader and search.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7A3B1E}a:hover{color:#4F2412}
button,input{font:inherit}
button:focus-visible,input:focus-visible{outline:3px solid #2E4A8A;outline-offset:2px}
.be-det>summary{list-style:none;cursor:pointer}.be-det>summary::-webkit-details-marker{display:none}.be-det[open]>summary .be-chev{transform:rotate(180deg)}
@media (max-width:719px){.be-hxd{align-items:flex-end!important}.be-hxd-panel{height:92vh!important;width:100%!important;border-radius:18px 18px 0 0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:719px){[data-focus=map]:not(.be-focused){padding-top:56px!important}}
@media (min-width:720px){.be-focused .be-tourcap{position:absolute;left:24px;right:24px;bottom:28px;z-index:9;margin:0 auto!important}}
@media (max-width:719px){.be-seg{flex-wrap:nowrap!important;overflow-x:auto;max-width:100%;scrollbar-width:none;-webkit-overflow-scrolling:touch}.be-seg::-webkit-scrollbar{display:none}.be-seg button{flex:none;padding:8px 12px!important;font-size:13px!important;white-space:nowrap}}
@media (max-width:719px){.be-seg[aria-label=View]{flex-wrap:wrap!important;overflow:visible;border-radius:24px!important}}
.be-seek{-webkit-appearance:none;appearance:none;width:100%;height:18px;margin:0;background:transparent;cursor:pointer;touch-action:none}
.be-seek::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,#F6E2A8 var(--fill,0%),#5A4E42 var(--fill,0%))}
.be-seek::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(to right,#F6E2A8 var(--fill,0%),#5A4E42 var(--fill,0%))}
.be-seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#FBF7EF;margin-top:-5px;border:none}
.be-seek::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#FBF7EF;border:none}
</style>
</head>
<body>
<div id="app"></div>
<noscript>Explore Your Bible needs JavaScript to run.</noscript>
<script type="module" src="app.js?v=1795442657"></script>
</body>
</html>
