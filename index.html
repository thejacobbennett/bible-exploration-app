<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{if(localStorage.getItem('bibleExplorer.desktopView')==='1'){var sw=screen.width,sh=screen.height;if(Math.min(sw,sh)<720){var cw=(window.matchMedia&&matchMedia('(orientation: landscape)').matches)?Math.max(sw,sh):Math.min(sw,sh);var k=Math.max(0.1,Math.min(1,Math.round(cw/1280*1000)/1000));document.querySelector('meta[name=viewport]').setAttribute('content','width=1280, initial-scale='+k+', minimum-scale='+k+', maximum-scale=5');}}}catch(e){}</script>
<title>Explore Your Bible</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="Explore the 66 books of the Bible: the storyline, themes, maps, a full reader and search.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7A3B1E}a:hover{color:#4F2412}
button,input{font:inherit}
button:focus-visible,input:focus-visible{outline:3px solid #2E4A8A;outline-offset:2px}
.eyb-st{border-radius:4px}
.eyb-st.has{cursor:pointer;border-bottom:1.5px dotted #B3A084;padding-bottom:1px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .15s;-webkit-tap-highlight-color:transparent}
.eyb-st.has.open,.eyb-st.has:focus-visible{background:rgba(122,59,30,.10);border-bottom-color:#7A3B1E;outline:none}
@media (hover:hover){.eyb-st.has:hover{background:rgba(122,59,30,.10);border-bottom-color:#7A3B1E}.eyb-st.has:hover .eyb-tip{display:block}}
.eyb-tip{display:none;position:absolute;left:0;z-index:40;margin-top:1.55em;width:min(380px,100%);background:#231E19;color:#FBF7EF;border-radius:12px;padding:10px 12px 8px;box-shadow:0 10px 28px rgba(35,30,25,.28);font-size:14px;line-height:1.4;text-decoration:none;cursor:default;font-style:normal;font-weight:400;letter-spacing:0;text-transform:none}
.eyb-tip::before{content:"";position:absolute;left:0;right:0;top:-12px;height:12px}
.eyb-st.has.open .eyb-tip{display:block}
.eyb-tip{max-height:min(60vh,440px);overflow-y:auto;width:min(420px,100%)}
.eyb-ref.on{background:#FBF7EF;color:#231E19}
.eyb-vbox{display:block;margin-top:10px;padding-top:10px;border-top:1px solid rgba(251,247,239,.18)}
.eyb-vref{display:block;font-size:12px;font-weight:700;color:#D9B48C;margin-bottom:4px}
.eyb-vt{display:block;font-family:Georgia,'Times New Roman',serif;font-size:15px;line-height:1.6;color:#FBF7EF}
.eyb-vt sup{font-family:Inter,system-ui,sans-serif;font-size:10px;font-weight:700;color:#D9B48C;margin:0 3px 0 4px}
.eyb-open{display:inline-block;margin-top:8px;cursor:pointer;border:none;background:none;color:#D9B48C;padding:4px 0;min-height:32px;font-size:13px;font-weight:700;text-decoration:underline}
.eyb-tiph{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#D9B48C;margin-bottom:6px}
.eyb-refs{display:flex;flex-wrap:wrap;gap:6px}
.eyb-ref{cursor:pointer;border:1px solid rgba(251,247,239,.25);background:rgba(251,247,239,.08);color:#FBF7EF;border-radius:999px;padding:5px 10px;min-height:32px;font-size:13px;font-weight:600}
.eyb-ref:hover{background:#FBF7EF;color:#231E19}
.eyb-sp{position:relative}
.be-det>summary{list-style:none;cursor:pointer}.be-det>summary::-webkit-details-marker{display:none}.be-det[open]>summary .be-chev{transform:rotate(180deg)}
@media (max-width:719px){.be-hxd{align-items:flex-end!important}.be-hxd-panel{height:92vh!important;width:100%!important;border-radius:18px 18px 0 0}}
@media (max-width:719px){.be-steps{grid-template-columns:repeat(3,minmax(0,1fr))!important}.be-steps-span{display:none!important}}
@media (max-width:719px){.be-rail li{min-width:0!important;flex:1 1 0!important}.be-rail .be-rl{display:none}.be-rail .be-rc{width:30px!important;height:30px!important}.be-rail .be-rc svg{width:16px;height:16px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:719px){[data-focus=map]:not(.be-focused){padding-top:56px!important}}
#book-card [data-focus=map]:not(.be-focused){padding-top:52px}
@media (min-width:720px){.be-focused .be-tourcap{position:absolute;left:24px;right:24px;bottom:28px;z-index:9;margin:0 auto!important}}
@media (max-width:719px){.be-seg{flex-wrap:nowrap!important;overflow-x:auto;max-width:100%;scrollbar-width:none;-webkit-overflow-scrolling:touch}.be-seg::-webkit-scrollbar{display:none}.be-seg button{flex:none;padding:8px 12px!important;font-size:13px!important;white-space:nowrap}}
@media (max-width:719px){.be-seg[aria-label=View]{flex-wrap:wrap!important;overflow:visible;border-radius:24px!important}}
.be-seek{-webkit-appearance:none;appearance:none;width:100%;height:18px;margin:0;background:transparent;cursor:pointer;touch-action:none}
.be-seek::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,#F6E2A8 var(--fill,0%),#5A4E42 var(--fill,0%))}
.be-seek::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(to right,#F6E2A8 var(--fill,0%),#5A4E42 var(--fill,0%))}
.be-seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#FBF7EF;margin-top:-5px;border:none}
.be-seek::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#FBF7EF;border:none}
</style><script>
// Visit counting (GoatCounter: no cookies, no personal data). Each section counts as its own page.
(function(){
  var NAMES={overview:'home',plan:'paths',library:'books',compare:'traditions',practice:'traditions/practice'};
  var last=null, t=null;
  function pathFor(){
    var q=new URLSearchParams(location.search), tab=q.get('tab')||'overview', p='/'+(NAMES[tab]||tab);
    if(tab==='plan'){ if(q.get('pathId')){ p+='/'+q.get('pathId'); if(q.get('pathId')!=='year') p+='/step-'+(q.get('pathStep')||1); } }
    else if(tab==='compare'){ p+='/'+(q.get('cmpMode')||'trad')+(q.get('cmpView')?'/'+q.get('cmpView'):''); }
    else if(tab==='practice'){ if(q.get('prId')) p+='/'+q.get('prId'); }
    else if(tab==='story'){ if(q.get('era')) p+='/era-'+q.get('era'); }
    else if(tab==='themes'){ if(q.get('theme')) p+='/'+q.get('theme'); }
    else if(tab==='read'){ if(q.get('book')) p+='/'+q.get('book'); }
    else if(tab==='library'||tab==='overview'){ if(q.get('book')) p='/books/'+q.get('book'); }
    return p;
  }
  function send(){
    var p=pathFor(); if(p===last) return;
    if(!window.goatcounter||!window.goatcounter.count){ setTimeout(send,500); return; }
    last=p; window.goatcounter.count({path:p, title:document.title});
  }
  function later(){ clearTimeout(t); t=setTimeout(send,800); }
  ['pushState','replaceState'].forEach(function(m){ var o=history[m]; history[m]=function(){ var r=o.apply(this,arguments); later(); return r; }; });
  addEventListener('popstate',later);
  window.goatcounter={no_onload:true};
  later();
})();
</script>
<script data-goatcounter="https://exploreyourbible.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
